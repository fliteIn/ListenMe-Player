name: listenme_player
description: Аудиоплеер для изучения языков
version: 1.0.1+20

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  hive: ^2.2.3
  hive_flutter: ^1.1.0

  url_launcher: ^6.2.6
  flutter_file_dialog: ^3.0.2

  reorderables: ^0.6.0

  device_info_plus: ^10.1.0

  package_info_plus: ^8.0.0
  receive_sharing_intent: ^1.8.1

  firebase_core: ^4.2.0
  firebase_analytics: ^12.0.3

  in_app_purchase: ^3.2.3
  google_mobile_ads: ^6.0.0
  rxdart: ^0.27.7
  animations: ^2.0.11
  page_transition: ^2.0.9

  permission_handler: ^11.0.1
  ffmpeg_kit_flutter_new: 3.2.0

  path: ^1.8.3

  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  shared_preferences: ^2.2.2
  flutter_colorpicker: ^1.0.3
  just_audio: ^0.9.40
  

  flutter_svg: ^2.0.7

  audio_service: ^0.18.11
  audio_session: ^0.1.15
  file_picker: ^10.3.3
  provider: ^6.1.1
  path_provider: ^2.1.1

  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  rename: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon.png
    - assets/splash_fullscreen.png
    - assets/logo_active_part.png
    - assets/logo_inactive_part.png
    - assets/backgrounds/standard.jpg
    - assets/backgrounds/dark.jpg
    - assets/backgrounds/light.png
    - assets/backgrounds/custom.jpg

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#F4F2FB"
  image: assets/backgrounds/custom.jpg
  android_gravity: center
  ios_content_mode: center
